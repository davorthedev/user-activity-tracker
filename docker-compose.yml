services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - 8080:80
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
  
  php:
    build:
      context: ./docker/php
    environment:
      APP_DEV: dev
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: db_user_activity_tracker
      DB_USER: app
      DB_PASSWORD: secreto
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
  
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_user_activity_tracker
      MYSQL_USER: app
      MYSQL_PASSWORD: secreto
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations/00-test-db.sql:/docker-entrypoint-initdb.d/00-test-db.sql:ro
      - ./migrations/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 21
      start_period: 10s

volumes:
  mysql-data:

